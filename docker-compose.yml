services:
  mongodb:
    image: mongo:7
    container_name: oryn-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - oryn-network

  redis:
    image: redis:7-alpine
    container_name: oryn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - oryn-network

  mock-oracles:
    build:
      context: .
      dockerfile: ./scripts/mock-oracles/Dockerfile
    container_name: oryn-mock-oracles
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      PORT: 5005
      NODE_ENV: development
    networks:
      - oryn-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oryn-backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
      - mock-oracles
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://mongodb:27017/oryn-finance
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:8080
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      COINGECKO_API_URL: http://mock-oracles:5005/coingecko
      NEWS_API_URL: http://mock-oracles:5005/news-api
      SPORTS_API_URL: http://mock-oracles:5005/sports-api
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 1000
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5001/api/health/live', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - oryn-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: oryn-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"
    networks:
      - oryn-network

volumes:
  mongodb_data:

networks:
  oryn-network:
    driver: bridge
