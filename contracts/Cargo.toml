[workspace]
members = [
    "access-control",
    "market-factory",
    "prediction-market", 
    "amm-pool",
    "oracle-resolver",
    "governance",
    "zk-verifier",
    "x402-integration",
    "treasury",
    "tokens",
    "reputation",
    "insurance",
    "shared",
]

resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "27.0.0", default-features = false }
soroban-token-sdk = { version = "20.4.0", default-features = false }

# ethnum 1.5.0 (pulled in transitively via soroban-env-common, pinned there
# with an exact `=1.5.0` requirement) fails to compile on current stable
# rustc: it constructs a `TryFromIntError` via `mem::transmute(())`, assuming
# a zero-sized error type, which no longer holds. See
# vendor/ethnum-1.5.0-patched/Cargo.toml for details on this patch.
[patch.crates-io]
ethnum = { path = "vendor/ethnum-1.5.0-patched" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
